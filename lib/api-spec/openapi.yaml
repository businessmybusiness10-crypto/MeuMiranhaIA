openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /system/status:
    get:
      operationId: systemStatus
      tags: [health]
      summary: System status
      description: Returns operational information for the desktop administration panel
      responses:
        "200":
          description: Current system status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SystemStatus:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        environment:
          type: string
        version:
          type: string
        startedAt:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
        checkedAt:
          type: string
          format: date-time
      required:
        - status
        - service
        - environment
        - version
        - startedAt
        - uptimeSeconds
        - checkedAt

