kind = "mobile"
previewPath = "/"
title = "Miranha IA ❤️"
description = "Um companheiro virtual romântico para celular, criado para oferecer carinho, mensagens especiais, motivação, versículos e uma conversa acolhedora com respostas locais e histórico salvo no dispositivo."
version = "1.0.0"
id = "artifacts/miranha-ia"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24531

[services.development]
run = "pnpm --filter @workspace/miranha-ia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/miranha-ia", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/miranha-ia", "run", "serve" ]

[services.env]
PORT = "24531"
BASE_PATH = "/"
